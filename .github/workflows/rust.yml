name: Release POP binaries (all OS)

on:
  release:
    types: [created]

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -------- Minimal --------
      - name: Build Linux minimal
        uses: rust-build/rust-build.action@v1.4.5
        with:
          TOOLCHAIN_VERSION: stable
          RUSTTARGET: x86_64-unknown-linux-gnu
          EXTRA_COMMAND_FLAGS: --no-default-features

      - run: |
          mv target/x86_64-unknown-linux-gnu/release/pop pop-minimal-linux
          chmod +x pop-minimal-linux

      # -------- Full --------
      - name: Build Linux full
        uses: rust-build/rust-build.action@v1.4.5
        with:
          TOOLCHAIN_VERSION: stable
          RUSTTARGET: x86_64-unknown-linux-gnu
          FEATURES: server

      - run: |
          mv target/x86_64-unknown-linux-gnu/release/pop pop-full-linux
          chmod +x pop-full-linux

      - name: Upload Linux binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pop-minimal-linux
            pop-full-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  other:
    strategy:
      matrix:
        include:
          - os: windows-latest
            ext: .exe
            name: windows
          - os: macos-latest
            ext: ""
            name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      # -------- Minimal --------
      - run: cargo build --release --no-default-features

      - run: |
          mv target/release/pop${{ matrix.ext }} pop-minimal-${{ matrix.name }}${{ matrix.ext }}

      # -------- Full --------
      - run: cargo build --release --features server

      - run: |
          mv target/release/pop${{ matrix.ext }} pop-full-${{ matrix.name }}${{ matrix.ext }}

      - name: Upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pop-minimal-${{ matrix.name }}${{ matrix.ext }}
            pop-full-${{ matrix.name }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
