name: Release POP binaries (all OS)

on:
  release:
    types: [created]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================
      # Build MINIMAL
      # =========================
      - name: Build pop-minimal
        uses: rust-build/rust-build.action@v1.4.5
        with:
          TOOLCHAIN_VERSION: stable
          RUSTTARGET: ${{ matrix.target }}
          EXTRA_ARGS: --no-default-features

      - name: Rename minimal binary
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/pop${{ matrix.ext }} pop-minimal-${{ matrix.target }}${{ matrix.ext }}
          chmod +x pop-minimal-${{ matrix.target }}${{ matrix.ext }} || true

      # =========================
      # Build FULL (server)
      # =========================
      - name: Build pop-full
        uses: rust-build/rust-build.action@v1.4.5
        with:
          TOOLCHAIN_VERSION: stable
          RUSTTARGET: ${{ matrix.target }}
          EXTRA_ARGS: --features server

      - name: Rename full binary
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/pop${{ matrix.ext }} pop-full-${{ matrix.target }}${{ matrix.ext }}
          chmod +x pop-full-${{ matrix.target }}${{ matrix.ext }} || true

      # =========================
      # Upload to GitHub Release
      # =========================
      - name: Upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pop-minimal-${{ matrix.target }}${{ matrix.ext }}
            pop-full-${{ matrix.target }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
