[package]
name = "pop"
version = "0.10.2"
edition = "2021"

[features]
default = []
server = ["axum", "tokio", "tracing", "tracing-subscriber", "tower", "tower-http"]

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
hex = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
rand = "0.8"
# server-only deps (enabled via feature "server")
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", optional = true, features = ["limit", "timeout"] }

axum = { version = "0.7", optional = true, features = ["macros"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }

# (optional) you can keep reqwest if you actually use it somewhere
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
